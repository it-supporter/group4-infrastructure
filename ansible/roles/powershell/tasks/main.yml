---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - wget
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: true

- name: Download Microsoft repository package
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
    dest: /tmp/packages-microsoft-prod.deb
    mode: "0644"

- name: Install Microsoft repository
  ansible.builtin.apt:
    deb: /tmp/packages-microsoft-prod.deb

- name: Update package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install latest PowerShell
  ansible.builtin.apt:
    name: powershell
    state: latest

- name: Verify PowerShell version
  ansible.builtin.command: pwsh -Version
  register: pwsh_version
  changed_when: false

- name: Display PowerShell version
  ansible.builtin.debug:
    msg: "{{ pwsh_version.stdout }}"
