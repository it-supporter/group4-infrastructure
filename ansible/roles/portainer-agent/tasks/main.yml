---
- name: Deploy Portainer Agent container
  tags:
    - portainer-agent
    - container

  community.docker.docker_container:
    name: "{{ portainer_agent_container_name }}"
    image: "{{ portainer_agent_image }}"
    state: started
    restart_policy: unless-stopped

    published_ports:
      - "{{ portainer_agent_port }}:9001"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host

- name: Gather Portainer Agent container information
  tags:
    - portainer-agent
    - validation

  community.docker.docker_container_info:
    name: "{{ portainer_agent_container_name }}"
  register: portainer_agent_info

- name: Display Portainer Agent status
  tags:
    - portainer-agent
    - validation

  ansible.builtin.debug:
    msg: >
      Portainer Agent running:
      {{ portainer_agent_info.container.Name }}
