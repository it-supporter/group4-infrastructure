---
- name: Verify host connectivity
  ansible.builtin.ping:

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - curl
      - wget
      - git
      - vim
      - htop
      - tree
      - net-tools
      - dnsutils
      - unzip
      - python3-pip
    state: present

- name: Enable qemu guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Display package count
  ansible.builtin.debug:
    msg: "{{ ansible_hostname }} has {{ ansible_facts.packages | length }} installed packages"

- name: Configure timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Display configured timezone
  ansible.builtin.debug:
    msg: "Configured timezone: {{ common_timezone }}"
