---
- name: Infrastructure Health Check
  hosts: linux
  gather_facts: true

  tasks:

    - name: Verify connectivity
      ansible.builtin.ping:

    - name: Display hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ ansible_hostname }}"

    - name: Display primary IP
      ansible.builtin.debug:
        msg: "IP Address: {{ ansible_default_ipv4.address }}"

    - name: Display OS
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Display virtualization platform
      ansible.builtin.debug:
        msg: "Virtualization: {{ ansible_virtualization_type }}"

    - name: Show uptime
      ansible.builtin.debug:
        msg: >
          Uptime:
          {{ (ansible_uptime_seconds / 86400) | round(1) }} days

    - name: Display memory
      ansible.builtin.debug:
        msg: >
          RAM:
          {{ ansible_memtotal_mb }} MB total,
          {{ ansible_memfree_mb }} MB free

    - name: Display root filesystem usage
      ansible.builtin.debug:
        msg: >
          Root filesystem:
          {{
            (
              (
                ansible_mounts
                | selectattr('mount', 'equalto', '/')
                | map(attribute='size_total')
                | first
              ) / 1024 / 1024 / 1024
            ) | round(1)
          }} GB total

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check qemu guest agent
      ansible.builtin.debug:
        msg: >
          qemu-guest-agent:
          {{
            ansible_facts.services['qemu-guest-agent.service'].state
            if 'qemu-guest-agent.service' in ansible_facts.services
            else 'NOT INSTALLED'
          }}

    - name: Display platform role
      ansible.builtin.debug:
        msg: "Platform Role: {{ platform_role | default('UNDEFINED') }}"

    - name: Display docker environment
      ansible.builtin.debug:
        msg: "Docker Environment: {{ docker_environment | default('UNDEFINED') }}"

    - name: Check Docker service status
      ansible.builtin.debug:
        msg: >
          Docker Service:
          {{
            ansible_facts.services['docker.service'].state
            if 'docker.service' in ansible_facts.services
            else 'NOT INSTALLED'
          }}
      when: platform_role | default('') == 'docker'

    - name: Get Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      when: platform_role | default('') == 'docker'

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "Docker Version: {{ docker_version.stdout }}"
      when: platform_role | default('') == 'docker'

    - name: Get running container count
      ansible.builtin.command: docker ps -q
      register: docker_containers
      changed_when: false
      when: platform_role | default('') == 'docker'

    - name: Display running container count
      ansible.builtin.debug:
        msg: "Running Containers: {{ docker_containers.stdout_lines | length }}"
      when: platform_role | default('') == 'docker'
