---
- name: Wait for Cyber Range VMs
  hosts: all
  gather_facts: false

  tasks:

    - name: Wait for SSH
      wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather facts
      setup:

    - name: Wait for cloud-init
      command: cloud-init status --wait
      register: cloudinit_result
      changed_when: false
      failed_when: cloudinit_result.rc not in [0, 2]
