---
- name: Gather infrastructure facts
  hosts: linux
  gather_facts: true

  tasks:
    - name: Show hostname
      debug:
        msg:
          - "Host: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "IP: {{ ansible_default_ipv4.address }}"
          - "Memory MB: {{ ansible_memtotal_mb }}"
          - "CPU Cores: {{ ansible_processor_vcpus }}"
