name: Infrastructure Validation

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  validate:
    runs-on: docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl \
            unzip \
            git \
            ansible

          curl -fsSL \
            https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip \
            -o terraform.zip

          mkdir -p /tmp/terraform-install

          unzip -o terraform.zip -d /tmp/terraform-install

          install -m 0755 \
            /tmp/terraform-install/terraform \
            /usr/local/bin/terraform

          terraform version
          ansible --version

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Validate Ansible Inventory
        run: |
          cd ansible
          ansible-inventory -i inventory/hosts.yml --list >/dev/null

      - name: Validate Ansible Playbooks
        run: |
          cd ansible
          ansible-playbook \
            -i inventory/hosts.yml \
            playbooks/site.yml \
            --syntax-check
