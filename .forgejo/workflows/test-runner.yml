name: Test Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [host]

    steps:
      - name: Show environment
        run: |
          whoami || true
          hostname || true
          pwd || true

      - name: Test host runner access
        run: |
          echo "===== USER ====="
          whoami || true

          echo "===== ID ====="
          id || true

          echo "===== HOSTNAME ====="
          hostname || true

          echo "===== CURRENT DIRECTORY ====="
          pwd || true

          echo "===== CYBERRANGE REPO ====="
          ls -la /home/henrik/git/CyberRange | head || true

          echo "===== TERRAFORM ====="
          which terraform || true

          echo "===== ANSIBLE ====="
          which ansible-playbook || true

          echo "===== STATUS API ====="
          ls -ld /home/henrik/cyberrange-api || true

          echo "Host runner is working"

      - name: Inspect runner environment
        run: |
          echo "===== ID ====="
          id || true

          echo "===== USER ====="
          whoami || true

          echo "===== HOSTNAME ====="
          hostname || true

          echo "===== PWD ====="
          pwd || true

          echo "===== ROOT ====="
          ls -la /

          echo "===== HOME ====="
          echo "$HOME"

          echo "===== MOUNTS ====="
          mount | head -50 || true

          echo "===== PASSWD ====="
          cat /etc/passwd || true

          echo "===== CYBERRANGE ====="
          ls -la /home/henrik/git/CyberRange || true

          echo "===== TERRAFORM ====="
          which terraform || true

          echo "===== ANSIBLE ====="
          which ansible-playbook || true

      - name: Inspect data directory
        run: |
          echo "===== DATA ====="
          ls -la /data

          echo "===== DATA RECURSIVE ====="
          find /data -maxdepth 3 -type f | sort

      - name: Test SSH to automation01
        run: |
          set -e

          echo "Installing SSH client..."
          apt-get update && apt-get install -y openssh-client

          echo "===== SSH KEY CHECK ====="
          ls -la /data/ssh

          echo "===== TEST SSH CONNECTION ====="

          ssh -i /data/ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            henrik@10.4.10.50 \
            "hostname && whoami && uptime"
