name: Test Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [docker]

    steps:
      - name: Show environment
        run: |
          whoami
          hostname
          pwd

      - name: Test SSH to automation01
        run: |
          mkdir -p ~/.ssh

          cp /data/ssh/id_ed25519 ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            henrik@10.4.10.50 \
            hostname
