name: Test Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [host]

    steps:
      - name: Show environment
        run: |
          whoami
          hostname
          pwd

      - name: Test host runner access
        run: |
          echo "===== USER ====="
          whoami

          echo "===== HOSTNAME ====="
          hostname

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== CYBERRANGE REPO ====="
          ls -la /home/henrik/git/CyberRange | head

          echo "===== TERRAFORM ====="
          which terraform || true

          echo "===== ANSIBLE ====="
          which ansible-playbook || true

          echo "===== STATUS API ====="
          ls -ld /home/henrik/cyberrange-api || true

          echo "Host runner is working"
