name: Test Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [docker]

    steps:
      - name: Show environment
        run: |
          whoami
          hostname
          pwd

      - name: Network diagnostics
        run: |
          echo "===== DNS ====="
          getent hosts automation01 || true

          echo
          echo "===== PING ====="
          ping -c 3 automation01 || true

          echo
          echo "===== TCP 22 ====="
          nc -zv automation01 22 || true

          echo
          echo "===== ROUTE ====="
          ip route || true

          echo
          echo "===== RESOLV.CONF ====="
          cat /etc/resolv.conf || true
